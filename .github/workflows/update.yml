name: Atualizar eventos
on:
  schedule: [{cron: "0 9,21 * * *"}]
  workflow_dispatch:
    inputs:
      url:
        description: "Opcional: URL para testar (modo diagnóstico, não altera o site)"
        required: false
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Testar uma fonte
        if: ${{ inputs.url != '' }}
        run: python scripts/collect.py --inspect "${{ inputs.url }}"
      - name: Coletar eventos
        if: ${{ inputs.url == '' }}
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python scripts/collect.py
      - name: Salvar
        if: ${{ inputs.url == '' }}
        run: |
          git config user.name "agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add events.json; git diff --cached --quiet || (git commit -m "Atualiza eventos" && git push)
