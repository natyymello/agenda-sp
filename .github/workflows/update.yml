name: Atualizar eventos
on:
  schedule: [{cron: "0 9,21 * * *"}]   # 2x por dia (UTC)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/collect.py
      - run: |
          git config user.name "agenda-bot"; git config user.email "bot@users.noreply.github.com"
          git add events.json; git diff --cached --quiet || (git commit -m "Atualiza eventos" && git push)
